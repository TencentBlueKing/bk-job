<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无访问权限 - BK-JOB OP</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft Yahei", "PingFang SC", Arial, sans-serif;
      background: #f5f7fa;
      color: #63656e;
    }
    .panel {
      max-width: 560px;
      margin: 120px auto;
      padding: 40px;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .code {
      font-size: 64px;
      font-weight: bold;
      color: #ff9c01;
      line-height: 1;
    }
    .title {
      margin: 20px 0 12px;
      font-size: 20px;
      color: #313238;
    }
    .desc {
      font-size: 14px;
      line-height: 24px;
    }
  </style>
</head>
<body>
<div class="panel">
  <div class="code">403</div>
  <div class="title">无访问权限</div>
  <p class="desc">
    当前登录用户不在 BK-JOB OP 的访问白名单内。<br>
    请联系管理员将你的用户名加入配置项 <code>job.op.web.auth.whitelist</code> 后重启服务。
  </p>
</div>
</body>
</html>
