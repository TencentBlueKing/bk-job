{{/*
config-watcher 开启且 RabbitMQ 由 KMS 接管时，单独渲染一份明文 Secret。watcher 关闭时不落这份口令。
*/}}
{{- if and .Values.k8sConfigWatcherConfig.enabled (eq (include "job.kms.credential.active" (dict "name" "rabbitmq" "context" .)) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "job.fullname" .) "config-watcher-rabbitmq" }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  rabbitmq-password: {{ .Values.externalRabbitMQ.password | b64enc | quote }}
  rabbitmq-truststore-password: {{ .Values.externalRabbitMQ.tls.trustStorePassword | b64enc | quote }}
  rabbitmq-keystore-password: {{ .Values.externalRabbitMQ.tls.keyStorePassword | b64enc | quote }}
{{- end }}
