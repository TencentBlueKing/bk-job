{{- if eq (include "job.kms.mariadb.active" .) "true" }}
{{- $sa := include "job.serviceAccountName" . }}
{{- if eq $sa "default" }}
{{- fail "KMS requires a non-default ServiceAccount: set serviceAccount.create=true or serviceAccount.name" }}
{{- end }}
{{- $cred := .Values.kms.credentials.mariadb }}
{{- if or (not $cred.role) (not $cred.remoteKey) }}
{{- fail "kms.credentials.mariadb.role and kms.credentials.mariadb.remoteKey are required when KMS is enabled for external MariaDB" }}
{{- end }}
{{- if not .Values.kms.server }}
{{- fail "kms.server is required when KMS is enabled" }}
{{- end }}
{{- if not .Values.kms.path }}
{{- fail "kms.path is required when KMS is enabled" }}
{{- end }}
{{- if and .Values.kms.tls.enabled (or (and .Values.kms.tls.certFilename (not .Values.kms.tls.certKeyFilename)) (and .Values.kms.tls.certKeyFilename (not .Values.kms.tls.certFilename))) }}
{{- fail "kms.tls.certFilename and kms.tls.certKeyFilename must be configured together" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ printf "%s-%s" (include "job.fullname" .) "mariadb-secret-store" }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.kms.server | quote }}
      path: {{ .Values.kms.path | quote }}
      version: "v2"
      {{- if and .Values.kms.tls.enabled .Values.kms.tls.certCAFilename }}
      caProvider:
        type: Secret
        name: {{ required "kms.tls.existingSecret is required when kms.tls.enabled=true" .Values.kms.tls.existingSecret | quote }}
        key: {{ .Values.kms.tls.certCAFilename | quote }}
      {{- end }}
      {{- if and .Values.kms.tls.enabled .Values.kms.tls.certFilename }}
      tls:
        certSecretRef:
          name: {{ .Values.kms.tls.existingSecret | quote }}
          key: {{ .Values.kms.tls.certFilename | quote }}
        keySecretRef:
          name: {{ .Values.kms.tls.existingSecret | quote }}
          key: {{ .Values.kms.tls.certKeyFilename | quote }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $cred.role | quote }}
          serviceAccountRef:
            name: {{ $sa | quote }}
{{- end }}
