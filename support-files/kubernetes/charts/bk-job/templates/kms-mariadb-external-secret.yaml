{{- if eq (include "job.kms.mariadb.active" .) "true" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "job.fullname" .) "mariadb-external-secret" }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.kms.refreshInterval | quote }}
  secretStoreRef:
    name: {{ printf "%s-%s" (include "job.fullname" .) "mariadb-secret-store" }}
    kind: SecretStore
  target:
    name: {{ include "job.mariadb.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: privateKey
      remoteRef:
        key: {{ .Values.kms.credentials.mariadb.remoteKey | quote }}
        property: private_key
    - secretKey: envelope
      remoteRef:
        key: {{ .Values.kms.credentials.mariadb.remoteKey | quote }}
        property: envelope
{{- end }}
