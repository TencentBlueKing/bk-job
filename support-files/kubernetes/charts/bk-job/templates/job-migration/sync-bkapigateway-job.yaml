{{- if .Values.bkApiGatewayConfig.sync }}
{{- $kms := eq (include "job.kms.credential.active" (dict "name" "migration" "context" .)) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-sync-api-gateway-{{ .Chart.Version }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: "job-sync-bk-api-gateway"
    {{ include "job.labelKeys.imageTag" . }} : {{ .Values.bkApiGatewayConfig.image.tag | quote }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 2
  parallelism: 1
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component : "job-sync-bk-api-gateway"
    spec:
      {{- include "job.imagePullSecrets" . | nindent 6 }}
      containers:
      - command:
        - bash
        args:
        - bin/sync-bkapigateway.sh
        image: {{ include "job-sync-bk-api-gateway.image" . }}
        imagePullPolicy: {{ .Values.bkApiGatewayConfig.image.pullPolicy }}
        resources:
          {{- toYaml .Values.bkApiGatewayConfig.resources | nindent 10 }}
        name: job-sync-bk-api-gateway
        env:
        - name: BK_APIGW_NAME
          value: {{ .Values.bkApiGatewayConfig.gatewayName }}
        - name: BK_APIGW_API_TYPE
          value: {{ .Values.bkApiGatewayConfig.apiType | quote }}
        {{- if $kms }}
        - name: ENABLE_KMS
          value: "true"
        - name: BK_APIGW_MANAGER_KMS_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "job.kms.targetSecretName" (dict "name" "migration" "context" .) }}
              key: privateKey
        - name: BK_APIGW_MANAGER_KMS_ENVELOPE_PATH
          value: /etc/kms/migration/envelope
        {{- else }}
        - name: BK_APP_CODE
          value: {{ .Values.appCode }}
        - name: BK_APP_SECRET
          value: {{ .Values.appSecret }}
        {{- end }}
        - name: BK_APP_TENANT_ID
          value: {{ if .Values.tenant.enabled }}"system"{{ else }}"default"{{ end }}
        - name: BK_API_URL_TMPL
          value: {{ .Values.bkApiGatewayConfig.url }}
        - name: BK_JOB_STAGE_NAME
          value: {{ .Values.bkApiGatewayConfig.stage }}
        - name: BK_APIGW_RESOURCE_DOCS_BASE_DIR
          value: {{ .Values.bkApiGatewayConfig.resourceDir }}
        - name: BK_JOB_WEB_HOST
          value: "{{ include "job.web.host" . }}"
        - name: BK_JOB_API_PATH_PREFIX
          value: "{{ include "job.api.path.prefix" . }}"
        - name: BK_APIGW_MAINTAINERS
          value: {{ .Values.bkApiGatewayConfig.maintainers }}
        - name: BK_APIGW_AUTO_PUBLISH
          value: {{.Values.bkApiGatewayConfig.autoPublish | quote }}
        - name: BK_SOPS_APP_CODE
          value: {{ .Values.bkSopsAppCode }}
        - name: BK_NODEMAN_APP_CODE
          value: {{ .Values.bkNodemanAppCode }}
        - name: BK_DBM_APP_CODE
          value: {{ .Values.bkDbmAppCode }}
        - name: BK_MONITOR_APP_CODE
          value: {{ .Values.bkMonitorAppCode }}
        - name: BK_LOG_SEARCH_APP_CODE
          value: {{ .Values.bkLogSearchAppCode }}
        - name: BK_BCS_APP_CODE
          value: {{ .Values.bkBcsAppCode }}
        {{- if $kms }}
        volumeMounts:
          {{- include "job.kms.envelopeVolumeMount" (dict "credential" "migration" "context" .) | nindent 10 }}
      volumes:
        {{- include "job.kms.envelopeVolume" (dict "credential" "migration" "context" .) | nindent 8 }}
        {{- end }}
      restartPolicy: Never
{{- end }}
