{{- if .Values.bkai.enabled }}
{{- $kms := eq (include "job.kms.credential.active" (dict "name" "migration" "context" .)) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-sync-bk-aidev-{{ .Chart.Version }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: "job-sync-bk-aidev"
    {{ include "job.labelKeys.imageTag" . }} : {{ .Values.bkai.image.tag | quote }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  # 重试由脚本内部 BK_AIDEV_SYNC_MAX_RETRY 控制，脚本最终 exit 1 后 K8S Job 立即标记为 Failed
  backoffLimit: 0
  parallelism: 1
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component : "job-sync-bk-aidev"
    spec:
      {{- include "job.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "job.serviceAccountName" . | quote }}
      {{- if .Values.bkApiGatewayConfig.sync }}
      # 开启网关同步时，先通过 initContainer 等待网关同步 Job 完成（导入 resources.yaml、发布网关并注册 MCP Server），
      # 再启动 AIDEV 资源同步；作为普通 Job 纳入 Helm Release 管理，升级时由 Helm 自动清理旧版本 Job。
      initContainers:
      {{- include "job.initContainer.waitForSyncApiGateway" . | nindent 6 }}
      {{- end }}
      containers:
      - command:
        - bash
        args:
        - bin/sync-bkaidev.sh
        image: {{ include "job-sync-bk-aidev.image" . }}
        imagePullPolicy: {{ .Values.bkai.image.pullPolicy }}
        resources:
          {{- toYaml .Values.bkai.resources | nindent 10 }}
        name: job-sync-bk-aidev
        env:
        # 以下变量由 bkai-init 直接读取，变量名不可改。
        # 地址模板中的 {api_name} 由 bkai-init 替换成 bk-aidev（同步资源）；
        # 多租户且未指定初始化用户时，还会替换成 bk-user 查询默认 bk_admin 对应的 bk_username
        - name: BK_API_URL_TMPL
          value: {{ .Values.bkai.apiUrlTmpl | quote }}
        # bkai-init 调用 AIDEV 应用态接口需要应用身份。关闭 KMS 时直接注入 appCode/appSecret；
        # 开启后从 migration 信封的 bkapp_id_secret.default 解密，不把口令写进 Pod env。
        {{- if $kms }}
        - name: ENABLE_KMS
          value: "true"
        - name: BK_JOB_KMS_PRIVATE_KEY_MIGRATION
          valueFrom:
            secretKeyRef:
              name: {{ include "job.kms.targetSecretName" (dict "name" "migration" "context" .) }}
              key: privateKey
        {{- if .Values.bkai.accessToken }}
        - name: BK_AIDEV_REQUIRE_ACCESS_TOKEN
          value: "true"
        {{- end }}
        {{- else }}
        - name: BKAI_APP_CODE
          value: {{ .Values.appCode }}
        - name: BKAI_APP_SECRET
          value: {{ .Values.appSecret }}
        {{- end }}
        # bkai-init 仅在开启多租户时才使用租户 ID 并查询默认 bk_admin，不设置时按单租户处理
        - name: BKPAAS_MULTI_TENANT_MODE
          value: {{ .Values.tenant.enabled | default false | quote }}
        # 初始化资源使用的用户身份，access token 优先级高于用户名，用户名须为 bk_username；
        # 两者都不注入时 bkai-init 默认用 bk_admin，故留空时不注入，避免空值覆盖默认值
        {{- if and (not $kms) .Values.bkai.accessToken }}
        - name: BKAI_ACCESS_TOKEN
          value: {{ .Values.bkai.accessToken | quote }}
        {{- end }}
        {{- if .Values.bkai.username }}
        - name: BKAI_USERNAME
          value: {{ .Values.bkai.username | quote }}
        {{- end }}
        # 以下 BK_AIDEV_* 由 bin/sync-bkaidev.sh 读取，再转成 bkai-init 的命令行参数
        # 租户 ID 须为作业平台应用实际所在的租户，留空时多租户取 system，非多租户取 default
        - name: BK_AIDEV_TENANT_ID
          value: {{ .Values.bkai.tenantId | default (ternary "system" "default" (eq (toString .Values.tenant.enabled) "true")) | quote }}
        # 目标空间完整 ID，bkai-init 不会自动拼接租户前缀；资源文件不再声明 space，全部以该值为准
        - name: BK_AIDEV_SPACE
          value: {{ .Values.bkai.space | default (ternary "system-bkaidev" "bkaidev" (eq (toString .Values.tenant.enabled) "true")) | quote }}
        - name: BK_AIDEV_PACKAGE_PATH
          value: {{ .Values.bkai.packagePath | quote }}
        # 是否发布智能体，不发布时同步结果只是草稿，页面上的智能体不会更新
        - name: BK_AIDEV_PUBLISH
          value: {{ .Values.bkai.publish | quote }}
        # 是否只发布配置，脚本会转成 bkai-init 的 --publish_config_only=0/1
        - name: BK_AIDEV_PUBLISH_CONFIG_ONLY
          value: {{ .Values.bkai.publishConfigOnly | quote }}
        # 资源文件中${JOB_URL_BASE}占位符的取值，同步前由脚本渲染为真实地址
        - name: JOB_URL_BASE
          value: {{ include "job.url.base" . | quote }}
        # 资源文件中${JOB_AI_GENERATE_TYPE}占位符的取值，渲染进 Agent 的 spec.generate_type：
        # 多租户下为 global（全租户），非多租户下为 public（所有空间可见，供其他智能体调用）
        - name: JOB_AI_GENERATE_TYPE
          value: {{ ternary "global" "public" (eq (toString .Values.tenant.enabled) "true") | quote }}
        # 额外的智能体管理员（bk_username），values 中为数组，这里拼成空格分隔的字符串，
        # 由脚本转成 bkai-init 的 --admins 参数，为空时不传
        - name: BK_AIDEV_ADMINS
          value: {{ join " " .Values.bkai.admins | quote }}
        # 需要跳过同步的资源，格式为 kind/code；values 中为数组，这里拼成空格分隔的字符串传给脚本
        - name: BK_AIDEV_EXCLUDE_RESOURCES
          value: {{ join " " .Values.bkai.excludeResources | quote }}
        # Agent 引用的 MCP Server 由网关同步任务异步注册，这里通过有限重试等待其就绪
        - name: BK_AIDEV_SYNC_MAX_RETRY
          value: {{ .Values.bkai.syncMaxRetry | quote }}
        - name: BK_AIDEV_SYNC_RETRY_INTERVAL
          value: {{ .Values.bkai.syncRetryInterval | quote }}
        # 同步最终失败时是否忽略错误：false 时脚本以非 0 退出使 Job 与 Helm 部署失败，true 时以 0 退出忽略错误
        - name: BK_AIDEV_IGNORE_SYNC_ERROR
          value: {{ .Values.bkai.ignoreSyncError | default false | quote }}
        {{- if $kms }}
        volumeMounts:
          {{- include "job.kms.envelopeVolumeMount" (dict "credential" "migration" "context" .) | nindent 10 }}
        {{- end }}
      {{- if $kms }}
      volumes:
        {{- include "job.kms.envelopeVolume" (dict "credential" "migration" "context" .) | nindent 8 }}
      {{- end }}
      restartPolicy: Never
{{- end }}
