# definition.yaml 配置文件版本号，必填，固定值 1/2
# 1：key为stage; 只支持单个 stage， 并且 proxy_http只能配置一个后端服务
# 用sdk用最新的或者基础镜像版本apigw-manager:3.0.4不用区分，直接用2
spec_version: 2

release:
  # 发布版本号
  # 每次同步资源到网关会对比，如果资源有变更就会新增版本号，如果这里指定了版本号就用这里指定的，
  # 如果没有，就会用时间戳+上次的版本号生成一个，即上一次版本号+时间戳
  version: 3.10.0
  title: "3.10.0"
  comment: "3.10.0"

# 定义网关基本信息，用于命令 `sync_apigw_config`
apigateway:
  description: "蓝鲸作业平台API"
  # 网关的英文描述，蓝鲸官方网关需提供英文描述，以支持国际化
  description_en: "BlueKing Job API"
  # 是否公开；公开，则用户可查看资源文档、申请资源权限；不公开，则网关对用户隐藏
  is_public: true
  # 标记网关为官方网关，网关名需以 `bk-` 开头，可选；非官方网关，可去除此配置；取值：1表示官方网关（网关列表项带官方标识），10表示普通网关
  api_type: {{ environ.BK_APIGW_API_TYPE }}
  # 应用请求网关时，是否允许从请求参数 (querystring, body) 中获取蓝鲸认证信息，默认值为 true；
  # 如果为 false，则只能从请求头 X-Bkapi-Authorization 获取蓝鲸认证信息；
  # 新接入的网关，可以设置为 false，已接入的网关，待推动所有调用者将认证信息放到请求头后，可设置为 false
  allow_auth_from_params: false
  # 网关请求后端时，是否删除请求参数 (querystring, body) 中的蓝鲸认证敏感信息，比如 bk_token，为 true 表示允许删除；
  # 待请求网关的所有调用者，将认证参数放到请求头 X-Bkapi-Authorization 时，可将此值设置为 false
  allow_delete_sensitive_params: false
  # 网关维护人员，仅维护人员有管理网关的权限
  maintainers: {{ environ.BK_APIGW_MAINTAINERS }}

stages:
  - name: "{{ environ.BK_JOB_STAGE_NAME }}"
    description: "蓝鲸作业平台API"
    description_en: "BlueKing Job API"
    # 环境变量；如未使用，可去除此配置
    vars:
      # Job后台API路径的前缀，用于子路径模式部署
      api_path_prefix: "{{ environ.BK_JOB_API_PATH_PREFIX }}"
    # 代理配置
    # proxy_http 与 backends 二选一， 推荐使用 backends 方式配置
    # 网关版本 <= 1.13.3, 只支持一个后端服务, 默认是 default
    # 网关版本 1.13.3之后引入 backends 配置方式,支持多后端服务
    # 注意: 资源中引用的 backend 一定要配置， 否则会导入失败,不配置则会选  择 default 后端服务
    #      如果 backends 没有配置 default 且 resource 未指定 backend 则会导致版本发布校验失败
    backends:
      - name: "default"
        config:
          timeout: 60
          loadbalance: "roundrobin"
          hosts:
            # 网关调用后端服务的默认域名或IP，不包含Path，比如：http://api.example.com
            - host: {{ environ.BK_JOB_WEB_HOST }}
              weight: 100

    # 环境插件配置
    plugin_configs:
    #     - type: bk-rate-limit
    #       yaml: |-
    #         rates:
    #           __default:
    #           - period: 1
    #             tokens: 100
      # Header转换插件, 添加网关请求标识头
      - type: bk-header-rewrite
        yaml: |-
          set:
            - key: X-Bkapi-From
              value: 'bk-job-apigw'
          remove: []
    #     - type: bk-cors
    #       yaml: |-
    #         allow_origins: '*'
    #         allow_methods: '*'
    #         allow_headers: '*'
    #         expose_headers: '*'
    #         max_age: 86400
    #         allow_credential: false

    # MCP Server 配置，用于命令 `sync_apigw_stage_mcp_servers`
    # 前提条件（详见 apigw-manager 文档 sync_apigateway.md 的「MCP Server 配置说明」）：
    #   1. 仅支持 spec_version: 2；
    #   2. 该环境需已有生效的资源版本，即 MCP 同步必须排在 create_version_and_release_apigw 之后；
    #   3. resource_names 中的资源必须存在于生效版本中，对应 resources.yaml 中资源的 operationId；
    #   4. 若资源没有任何请求参数(body/path/header/query)，需在 resources.yaml 中显式声明 noneSchema: true，
    #      当前引用的资源均带请求参数，无需额外声明。
    # 注意：这里的 name 只是短名，网关侧实际的 MCP Server 名为 {网关名}-{环境名}-{name}，
    #      例如 name: mcp-query 在 prod 环境下最终为 bk-job-prod-mcp-query。
    # 可选字段（按需取消注释后填写）：
    #   tool_names: 资源重命名后的工具名，长度须与 resource_names 一致且不重复
    #   target_app_codes: 主动授权的应用列表
    #   category_names: MCP 市场分类，可选值见上述文档，不传则不更新分类
    #   oauth2_public_client_enabled / oauth2_personal_client_enabled / raw_response_enabled
    mcp_servers:
      # 任务查询：查询作业执行状态与执行对象日志
      - name: "mcp-query"
        title: "作业平台任务查询"
        description: "查询作业平台任务的执行状态与执行对象日志"
        # 是否公开：公开后其他应用可在 MCP 市场中发现并申请权限，权限仍需网关侧审批
        is_public: true
        # 状态：1-启用，0-停用
        status: 1
        # 协议类型：sse（默认）、streamable_http
        protocol_type: "streamable_http"
        labels: []
        resource_names:
          - v4_batch_get_job_instance_execute_object_log
          - v4_get_job_instance_status
        # 是否开启 OAuth2 公开客户端模式，开启后将对 bk_app_code=public 的应用授权，默认不开启
        oauth2_public_client_enabled : true
        # 是否开启 OAuth2 个人客户端模式(个人 token)，开启后将对 bk_app_code=personal 的应用授权，默认不开启
        oauth2_personal_client_enabled: true
        # 是否返回原始响应，开启后 mcp-proxy 将直接返回 API 响应结果，不添加 request_id 等额外信息，默认不开启
        raw_response_enabled: false
        # MCP Server 分类名称列表，不传则不更新分类
        category_names:
          - "Automation"
      # 资源查询：查询执行方案与定时任务等作业资源
      - name: "mcp-resources"
        title: "作业平台资源查询"
        description: "查询作业平台的执行方案、定时任务等资源"
        is_public: true
        status: 1
        protocol_type: "streamable_http"
        labels: []
        resource_names:
          - get_cron_list
          - get_job_plan_detail
          - get_job_plan_list
        # 是否开启 OAuth2 公开客户端模式，开启后将对 bk_app_code=public 的应用授权，默认不开启
        oauth2_public_client_enabled : true
        # 是否开启 OAuth2 个人客户端模式(个人 token)，开启后将对 bk_app_code=personal 的应用授权，默认不开启
        oauth2_personal_client_enabled: true
        # 是否返回原始响应，开启后 mcp-proxy 将直接返回 API 响应结果，不添加 request_id 等额外信息，默认不开启
        raw_response_enabled: false
        # MCP Server 分类名称列表，不传则不更新分类
        category_names:
          - "Automation"
      # 任务启动：启动执行方案，属于写操作
      - name: "mcp-start"
        title: "作业平台任务启动"
        description: "启动作业平台的执行方案"
        is_public: true
        status: 1
        protocol_type: "streamable_http"
        labels: []
        resource_names:
          - execute_job_plan
        # 是否开启 OAuth2 公开客户端模式，开启后将对 bk_app_code=public 的应用授权，默认不开启
        oauth2_public_client_enabled : true
        # 是否开启 OAuth2 个人客户端模式(个人 token)，开启后将对 bk_app_code=personal 的应用授权，默认不开启
        oauth2_personal_client_enabled: true
        # 是否返回原始响应，开启后 mcp-proxy 将直接返回 API 响应结果，不添加 request_id 等额外信息，默认不开启
        raw_response_enabled: false
        # MCP Server 分类名称列表，不传则不更新分类
        category_names:
          - "Automation"
      # 任务上下文：获取脚本/文件任务的上下文，供 AI 分析失败原因
      - name: "mcp-task-context"
        title: "作业平台任务上下文"
        description: "获取作业平台脚本任务与文件分发任务的执行上下文"
        is_public: true
        status: 1
        protocol_type: "streamable_http"
        labels: []
        resource_names:
          - v4_get_script_task_context
          - v4_get_file_task_context
        # 授权的应用
        target_app_codes:
          - "ai-bkjob-web"
        # 是否开启 OAuth2 公开客户端模式，开启后将对 bk_app_code=public 的应用授权，默认不开启
        oauth2_public_client_enabled : true
        # 是否开启 OAuth2 个人客户端模式(个人 token)，开启后将对 bk_app_code=personal 的应用授权，默认不开启
        oauth2_personal_client_enabled: true
        # 是否返回原始响应，开启后 mcp-proxy 将直接返回 API 响应结果，不添加 request_id 等额外信息，默认不开启
        raw_response_enabled: false
        # MCP Server 分类名称列表，不传则不更新分类
        category_names:
          - "Automation"
# 主动授权，网关主动给应用，添加访问网关所有资源或者具体某个资源的权限；
# 用于命令 `grant_apigw_permissions`
grant_permissions:
  # 标准运维
  - bk_app_code: "{{ environ.BK_SOPS_APP_CODE }}"
    # 授权维度，可选值：
    # gateway: 按网关授权，包括网关下所有资源，以及未来新创建的资源
    # resource: 按资源维度授权
    grant_dimension: "resource"
    # 如果是按照 resource 维度授权，需要提供如下的具体 resource_name
    resource_names:
      - system_execute_job_plan
      - system_fast_execute_script
      - system_fast_transfer_file
      - system_get_account_list
      - system_get_job_instance_global_var_value
      - system_get_job_instance_ip_log
      - system_get_job_instance_list
      - system_get_job_instance_status
      - system_get_job_plan_detail
      - system_get_job_plan_list
      - system_get_job_template_list
      - system_get_public_script_list
      - system_get_script_list
      - system_get_script_version_detail
      - system_get_script_version_list
      - system_push_config_file
      - system_save_cron
      - system_update_cron_status
      - system_generate_local_file_upload_url
  # 节点管理
  - bk_app_code: "{{ environ.BK_NODEMAN_APP_CODE }}"
    grant_dimension: "resource"
    resource_names:
      - system_fast_execute_script
      - system_fast_transfer_file
      - system_push_config_file
      - system_get_job_instance_status
      - system_get_job_instance_ip_log
      - system_create_credential
      - system_create_file_source
      - system_batch_get_job_instance_ip_log
  # DBM
  - bk_app_code: "{{ environ.BK_DBM_APP_CODE }}"
    grant_dimension: "resource"
    resource_names:
      - system_fast_execute_script
      - system_fast_transfer_file
      - system_push_config_file
      - system_get_job_instance_status
      - system_get_job_instance_ip_log
      - system_batch_get_job_instance_ip_log
      - system_create_credential
      - system_create_file_source
      - system_create_account
      - system_get_account_list
      - system_operate_step_instance
  # 监控平台
  - bk_app_code: "{{ environ.BK_MONITOR_APP_CODE }}"
    grant_dimension: "resource"
    resource_names:
      - system_get_job_plan_detail
      - system_get_job_plan_list
      - system_execute_job_plan
      - system_get_job_instance_status
      - system_fast_execute_script
      - system_batch_get_job_instance_ip_log
      - system_fast_transfer_file
      - system_get_job_instance_ip_log
  # 日志平台
  - bk_app_code: "{{ environ.BK_LOG_SEARCH_APP_CODE }}"
    grant_dimension: "resource"
    resource_names:
      - system_get_public_script_list
      - system_fast_execute_script
      - system_fast_transfer_file
      - system_get_job_instance_ip_log
      - system_get_job_instance_status
      - system_batch_get_job_instance_ip_log
  # 容器管理平台
  - bk_app_code: "{{ environ.BK_BCS_APP_CODE }}"
    grant_dimension: "resource"
    resource_names:
      - system_fast_execute_script
      - system_get_job_instance_status

# 资源文档
# 资源文档的目录格式样例如下，en 为英文文档，zh 为中文文档：
# ./
# - en
#   - anything.md
# - zh
#   - anything.md
resource_docs:
  # 资源文档的归档文件，可为 tar.gz，zip 格式文件
  archivefile: "{{ settings.BK_APIGW_RESOURCE_DOCS_ARCHIVE_FILE }}" ## 环境变量方式："{{ environ.BK_APIGW_RESOURCE_DOCS_ARCHIVE_FILE }}"
  # 资源文档目录，basedir 与 archivefile 二者至少一个有效，若同时存在，则 archivefile 优先
  # basedir: "{{ settings.BK_APIGW_RESOURCE_DOCS_BASE_DIR }}" ## 环境变量方式："{{ environ.BK_APIGW_RESOURCE_DOCS_BASE_DIR }}"
  basedir: "{{ environ.BK_APIGW_RESOURCE_DOCS_BASE_DIR }}"
