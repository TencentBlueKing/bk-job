                      operation_type:
                        type: string
                        description: '操作类型。可选值: FAST_EXECUTE_SCRIPT - 快速执行脚本，FAST_TRANSFER_FILE - 快速分发文件，EXECUTE_JOB_PLAN - 启动执行方案，CREATE_JOB_PLAN - 创建执行方案，SAVE_CRON - 保存定时任务，UPDATE_CRON_STATUS - 启停定时任务'
                      approval_channel:
                        type: string
                        description: '审批渠道。可选值: IMATE - IMate审批渠道'
