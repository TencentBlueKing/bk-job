                        type: number
                        description: 发起时刻，Unix时间戳，单位毫秒
                      expire_at:
                        type: number
                        description: 过期时刻，Unix时间戳，单位毫秒；过期后不可再放行
                      approver:
                        type: string
                        description: 审批人，由作业平台回查审批渠道得到；未审批时为null
                      approved_at:
                        type: number
                        description: 审批时刻，Unix时间戳，单位毫秒；未审批时为null
                      execute_result:
                        type: object
                        properties:
                          '':
                            type: string
                        description: 放行后的操作结果，结构与对应操作的直接执行接口返回的data一致（如快速执行脚本返回job_instance_id、step_instance_id、job_instance_name）；未执行时为null
                      result_unknown:
                        type: boolean
                        description: '执行结果未知标记。可选值: true - 执行请求已下发但未取得下游响应，需人工到执行历史确认是否已产生作业，系统不会自动重试; false - 结果明确'
                      message:
                        type: string
                        description: 面向用户的可读说明，随状态变化，如审批中、已过期、执行结果未知等提示
                    description: 响应数据，只有在正常响应时才存在该字段，异常响应时不存在
