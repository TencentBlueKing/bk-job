                        type: number
                        description: 定时作业状态：1.已启动、2.已暂停
                      creator:
                        type: string
                        description: 作业创建人帐号
                      expression:
                        type: string
                        description: '定时任务crontab的定时规则。各字段含义为：分 时 日 月 周，如: 0/5 * * * ? 表示每5分钟执行一次'
                      bk_scope_id:
                        type: string
                        description: 资源范围ID, 与bk_scope_type对应, 表示业务ID或者业务集ID
                      create_time:
                        type: number
                        description: 创建时间，Unix 时间戳(s)
                      job_plan_id:
                        type: number
                        description: 执行方案 ID
                      bk_scope_type:
                        type: string
                        description: '资源范围类型。可选值: biz - 业务，biz_set - 业务集'
                      last_modify_time:
                        type: number
                        description: 最后修改时间，Unix 时间戳(s)
                      last_modify_user:
                        type: string
                        description: 作业修改人帐号
                    description: 请求返回的数据
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                  message:
                    type: string
                    description: 请求失败返回的错误信息
                  permission:
                    type: object
                    properties:
                      '':
                        type: string
                    description: 权限信息
          description: ''
      parameters:
      - in: query
        name: bk_scope_type
        schema:
          type: string
        required: true
        description: '资源范围类型。可选值: biz - 业务，biz_set - 业务集'
      - in: query
        name: bk_scope_id
        schema:
          type: string
        required: true
        description: 资源范围ID, 与bk_scope_type对应, 表示业务ID或者业务集ID
      - in: query
        name: name
        schema:
          type: string
        description: 定时作业名称
      - in: query
        name: id
        schema:
          type: string
        description: 定时任务 ID，如果存在则忽略其他筛选条件，只查询这个指定的作业信息
      - in: query
        name: status
        schema:
          type: string
        description: 定时作业状态：1.已启动、2.已暂停
      - in: query
        name: creator
        schema:
          type: string
        description: 定时作业创建人帐号
      - in: query
        name: create_time_start
        schema:
          type: string
        description: 创建起始时间，Unix 时间戳(s)
      - in: query
        name: create_time_end
        schema:
          type: string
        description: 创建结束时间，Unix 时间戳(s)
      - in: query
        name: last_modify_user
        schema:
          type: string
        description: 作业修改人帐号
      - in: query
        name: last_modify_time_start
        schema:
          type: string
        description: 最后修改起始时间，Unix 时间戳(s)
      - in: query
        name: last_modify_time_end
        schema:
          type: string
        description: 最后修改结束时间，Unix 时间戳(s)
      - in: query
        name: start
        schema:
          type: number
          default: 0
        description: 起始位置，默认值为0表示从第1条记录开始返回
      - in: query
        name: length
        schema:
          type: number
          default: 20
        description: 单次返回最大记录数，最大1000，不传默认为20
