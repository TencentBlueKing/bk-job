        content:
          application/json:
            schema:
              type: object
              required:
              - bk_scope_type
              - bk_scope_id
              - execute_target
              properties:
                bk_scope_type:
                  type: string
                  description: '资源范围类型。可选值: biz - 业务，biz_set - 业务集'
                bk_scope_id:
                  type: string
                  description: 资源范围ID, 与bk_scope_type对应, 表示业务ID或者业务集ID
                approval_channel:
                  type: string
                  description: '审批渠道。可选值: IMATE - IMate审批渠道。不传时使用服务端配置的默认渠道。仅可指定渠道枚举，渠道地址与密钥一律来自服务端配置'
                task_name:
                  type: string
                  description: 自定义作业名称，长度不可超过512字符
