                            type: string
                            description: '拓扑节点类型。可选值: module - 模块, set - 集群'
                        description: 一个CMDB拓扑节点
                      description: CMDB拓扑节点列表。审批内容会标注实际执行台数在放行时重新解析确定，可能与发起时不同
