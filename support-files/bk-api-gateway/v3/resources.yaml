                script_id:
                  type: string
                  description: 引用的脚本ID，使用该脚本的上线版本。与script_content、script_version_id三者填一个
                script_version_id:
                  type: number
                  description: 引用的脚本版本ID。与script_content、script_id三者填一个，优先级最高
                script_language:
                  type: number
                  default: 1
                  description: '脚本语言，仅script_content方式需要。可选值: 1 - shell, 2 - bat, 3 - perl, 4 - python, 5 - powershell, 6 - sql'
                script_param:
                  type: string
                  description: 脚本参数Base64。注意：1.如果有多个参数，比如"param1 param2"这种，需要对"param1 param2"整体进行base64编码，而不是对每个参数进行base64编码再拼接起来。2.非敏感参数编码前长度不能超过64K，敏感参数编码前长度不能超过47K
                param_sensitive:
                  type: boolean
                  default: false
                  description: 脚本参数是否为敏感参数。敏感参数会在执行详情页面上隐藏，且在审批内容中只显示占位符，默认false
                account_alias:
                  type: string
