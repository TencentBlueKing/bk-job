                        type: string
                        description: 错误码
                      data:
                        type: object
                        properties:
                          '':
                            type: string
                        description: 具体的错误数据，如无权限时的缺少权限数据
                      message:
                        type: string
                        description: 错误信息
                    description: 错误信息，只有在异常响应时（HTTP状态码!=2xx）才存在该字段（权限不足、参数错误等），正常响应时不存在
