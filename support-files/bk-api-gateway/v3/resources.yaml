  /api/v3/update_cron_status:
    post:
      operationId: update_cron_status
      description: 更新定时作业状态
      tags:
        - open
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: 错误编码。 0表示success，>0表示失败错误
                  data:
                    type: number
                    description: 定时任务ID
                  result:
                    type: boolean
                    description: 请求成功与否。true:请求成功；false请求失败
                  message:
                    type: string
                    description: 请求失败返回的错误信息
          description: ''
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - bk_scope_type
              - bk_scope_id
              - id
              - status
              properties:
                bk_scope_type:
                  type: string
                  description: '资源范围类型。可选值: biz - 业务，biz_set - 业务集'
                bk_scope_id:
                  type: string
                  description: 资源范围ID, 与bk_scope_type对应, 表示业务ID或者业务集ID
                id:
                  type: number
                  description: 定时作业 ID
                status:
                  type: number
                  description: '定时状态。可选值: 1 - 启动, 2 - 暂停'
        required: false
        description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /{env.api_path_prefix}api/job/v3/job-crontab/update_cron_status
          matchSubpath: false
          timeout: 0
        pluginConfigs:
          - type: bk-header-rewrite
            yaml: |-
              set:
                - key: X-Bk-Job-Api-Type
                  value: 'user'
              remove: []
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn: Update cron status
